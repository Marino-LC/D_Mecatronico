# arm_controllers.yaml
# =====================
# Controladores en MODO POSICIÓN: robot real (xacro modo:=mock) y Gazebo
# cinemático (modo:=gazebo_posicion). Para el control de torque en Gazebo
# se usa arm_controllers_torque.yaml.
#
# Dos controladores independientes:
#   arm_controller    → 4 joints del brazo + riel
#   gripper_controller → 1 joint del gripper (abre/cierra)
#
# Mantenerlos separados permite enviar comandos al gripper
# sin interrumpir la trayectoria del brazo y viceversa.

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ── Controlador del brazo (4 joints) ─────────────────────────────
arm_controller:
  ros__parameters:
    joints:
      - moviento_en_x           # q0 riel lineal      [0 → 0.30 m en el xacro]
      - disco_soportes_rotacion # q1 giro de la base  [±2.094 rad]
      - brazo_motores           # q2 hombro           [±2.094 rad]
      - brazo_gripper_azul      # q3 codo             [±2.094 rad]

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# ── Controlador del gripper (1 joint) ────────────────────────────
gripper_controller:
  ros__parameters:
    joints:
      - gripper_mecanismo        # Gripper [0.0=cerrado → 1.0=abierto rad]

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

